name: Run Bot

concurrency:
  group: run-bot
  cancel-in-progress: true

permissions: write-all

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */4 * * *'

env:
  DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  TEST: Hello

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Show env vars
        run: echo "VARS - $DISCORD_TOKEN - $DATABASE_URL - $TEST"

      - name: Clone repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create .env file
        run: |
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

      - name: Restore perdition.db from ci-data branch
        run: |
          git fetch origin ci-data 2>/dev/null || echo "No ci-data branch yet, starting fresh"
          if git checkout origin/ci-data -- perdition.sql 2>/dev/null; then
            sqlite3 perdition.db < perdition.sql
            echo "Restored from perdition.sql"
          else
            echo "No existing perdition.sql found, starting fresh"
          fi

      - name: Run the app
        run: cargo run

      - name: Commit and Push perdition.sql
        if: always()
        run: |
          # Dump the live database to plain-text SQL
          sqlite3 perdition.db .dump > /tmp/perdition.sql

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Fetch ci-data so we can fast-forward push onto it
          git fetch origin ci-data 2>/dev/null || true

          # Switch to ci-data, creating it as an orphan on first run
          if git checkout -B ci-data origin/ci-data 2>/dev/null; then
            echo "Switched to existing ci-data branch"
          else
            git checkout --orphan ci-data
            git reset
            echo "Created new orphan ci-data branch"
          fi

          cp /tmp/perdition.sql perdition.sql
          git add perdition.sql
          git commit -m "Save perdition.sql from CI run: $GITHUB_RUN_ID" || echo "No changes to commit"
          git push origin ci-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
